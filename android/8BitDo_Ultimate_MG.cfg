# 8BitDo Ultimate MG          - https://www.8bitdo.com/     - https://www.8bitdo.com/ultimate-mobile-gaming-controller/
# Firmware v2.00              - https://support.8bitdo.com/ - https://support.8bitdo.com/firmware-updater.html

input_driver = "android"
input_device = "8BitDo Ultimate MG"
input_device_display_name = "8BitDo Ultimate MG"
input_vendor_id = "11720"
input_product_id = "8203"

# Face buttons diagonally swapped (A<->B, X<->Y) to match RetroPad's SNES-based
# ABXY position convention (A-right, B-bottom, X-top, Y-left) rather than this
# controller's native Xbox-style layout (A-bottom, B-right, X-left, Y-top).
# Labels describe the physical button, not the RetroPad slot name.
input_b_btn = "96"
input_b_btn_label = "A"
input_a_btn = "97"
input_a_btn_label = "B"
input_y_btn = "99"
input_y_btn_label = "X"
input_x_btn = "100"
input_x_btn_label = "Y"

# Shoulder buttons & triggers
input_l_btn = "102"
input_l_btn_label = "LB"
input_r_btn = "103"
input_r_btn_label = "RB"
input_l2_btn = "104"
input_l2_btn_label = "LT"
input_r2_btn = "105"
input_r2_btn_label = "RT"

# Stick clicks
input_l3_btn = "106"
input_l3_btn_label = "LSB"
input_r3_btn = "107"
input_r3_btn_label = "RSB"

# Paddles
# Left = BUTTON_Z (101), Right = BUTTON_C (98)
# note the reversed C/Z-to-L/R pairing.
input_l4_btn = "101"
input_l4_btn_label = "LP"
input_r4_btn = "98"
input_r4_btn_label = "RP"

# Start / Select
input_start_btn = "108"
input_start_btn_label = "Start"
input_select_btn = "109"
input_select_btn_label = "Select"

# D-pad
input_up_btn = "h0up"
input_up_btn_label = "D-Pad Up"
input_down_btn = "h0down"
input_down_btn_label = "D-Pad Down"
input_left_btn = "h0left"
input_left_btn_label = "D-Pad Left"
input_right_btn = "h0right"
input_right_btn_label = "D-Pad Right"

# Left stick
input_l_x_plus_axis = "+0"
input_l_x_plus_axis_label = "LS Right"
input_l_x_minus_axis = "-0"
input_l_x_minus_axis_label = "LS Left"
input_l_y_plus_axis = "+1"
input_l_y_plus_axis_label = "LS Down"
input_l_y_minus_axis = "-1"
